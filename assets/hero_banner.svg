
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    
    <!-- Accent Glows -->
    <radialGradient id="purple-glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyan-glow" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Glassmorphism Gradient -->
    <linearGradient id="glass-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Card Container -->
  <rect x="5" y="5" width="940" height="410" rx="24" fill="url(#hero-bg)" filter="url(#drop-shadow)" />
  <rect x="5" y="5" width="940" height="410" rx="24" fill="url(#purple-glow)" />
  <rect x="5" y="5" width="940" height="410" rx="24" fill="url(#cyan-glow)" />
  <rect x="5" y="5" width="940" height="410" rx="24" fill="none" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Abstract Mesh Background Lines -->
  <path d="M 0,150 Q 300,50 600,200 T 950,100" fill="none" stroke="#a855f7" stroke-opacity="0.2" stroke-width="2" />
  <path d="M 0,250 Q 400,350 700,150 T 950,300" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2" />

  <!-- Left Side: User Info -->
  <g transform="translate(45, 55)">
    <!-- Name -->
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Deekshith Reddy
    </text>
    
    <!-- Username & Profile Info -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#a855f7">
      @deekshithreddydev <tspan fill="#64748b">• Active Developer</tspan>
    </text>

    <!-- Divider Line -->
    <line x1="0" y1="120" x2="420" y2="120" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Tagline -->
    <text x="0" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1" font-style="italic">
      "Building Discord bots, web apps &amp; Minecraft systems."
    </text>

    <!-- Specialty Badge List -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="135" height="30" rx="8" fill="#5865F2" fill-opacity="0.2" stroke="#5865F2" stroke-width="1"/>
      <text x="67" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#818cf8" text-anchor="middle">🤖 Discord Bot Dev</text>

      <rect x="145" y="0" width="125" height="30" rx="8" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
      <text x="207" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">💻 Web Developer</text>

      <rect x="280" y="0" width="130" height="30" rx="8" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1"/>
      <text x="345" y="20" font-family="sans-serif" font-size="12" font-weight="700" fill="#4ade80" text-anchor="middle">🎮 Minecraft Dev</text>
    </g>
  </g>

  <!-- Right Side Visual Dashboard Panel -->
  <g transform="translate(500, 40)">
    <!-- Panel Outer Box -->
    <rect x="0" y="0" width="405" height="330" rx="20" fill="url(#glass-card)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    
    <!-- Banner Art Box -->
    <rect x="15" y="15" width="375" height="110" rx="14" fill="#1e1b4b" opacity="0.85" />
    <!-- Abstract Tech Elements -->
    <circle cx="60" cy="50" r="80" fill="#c084fc" opacity="0.2" />
    <circle cx="300" cy="90" r="70" fill="#38bdf8" opacity="0.2" />
    <path d="M 30,110 L 120,40 L 210,90 L 310,20 L 375,70" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.5" />

    <!-- Avatar Circle Layered -->
    <circle cx="70" cy="70" r="42" fill="#0f172a" stroke="#a855f7" stroke-width="3" />
    <text x="70" y="76" font-family="sans-serif" font-size="20" font-weight="800" fill="#38bdf8" text-anchor="middle">DR</text>

    <!-- Floating Stats Box -->
    <rect x="15" y="140" width="375" height="75" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    
    <!-- Stat 1: Reputation -->
    <g transform="translate(35, 160)">
      <text x="0" y="18" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">520+</text>
      <text x="0" y="36" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">⚡ REPUTATION</text>
    </g>
    <!-- Stat 2: Streak -->
    <g transform="translate(160, 160)">
      <text x="0" y="18" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">48</text>
      <text x="0" y="36" font-family="sans-serif" font-size="11" font-weight="600" fill="#f43f5e">🔥 STREAK</text>
    </g>
    <!-- Stat 3: Posts Read -->
    <g transform="translate(270, 160)">
      <text x="0" y="18" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">180+</text>
      <text x="0" y="36" font-family="sans-serif" font-size="11" font-weight="600" fill="#c084fc">👁️ READS</text>
    </g>

    <!-- Category Pill Tags -->
    <g transform="translate(15, 230)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="85" height="26" rx="13" fill="#1e293b" stroke="#5865F2" stroke-width="1" />
      <text x="42" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#818cf8" text-anchor="middle">#discordbot</text>

      <!-- Pill 2 -->
      <rect x="91" y="0" width="70" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="126" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">#webdev</text>

      <!-- Pill 3 -->
      <rect x="167" y="0" width="82" height="26" rx="13" fill="#1e293b" stroke="#22c55e" stroke-width="1" />
      <text x="208" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">#minecraft</text>

      <!-- Pill 4 -->
      <rect x="255" y="0" width="60" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="285" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">#fivem</text>

      <!-- Pill 5 -->
      <rect x="321" y="0" width="54" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="348" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">#java</text>
    </g>

    <!-- Social Icons Footer Bar -->
    <g transform="translate(15, 275)">
      <rect x="0" y="0" width="375" height="40" rx="10" fill="#0f172a" opacity="0.7" />
      <circle cx="25" cy="20" r="12" fill="#5865F2" />
      <text x="25" y="24" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">D</text>
      
      <circle cx="58" cy="20" r="12" fill="#38bdf8" />
      <text x="58" y="24" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">W</text>
      
      <circle cx="91" cy="20" r="12" fill="#22c55e" />
      <text x="91" y="24" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">M</text>

      <text x="355" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="end">deekshithreddydev</text>
    </g>
  </g>
</svg>
